# Entorno local del Sprint 1: docker compose up --build → http://localhost
# Copiar .env.example a .env y completar los secretos antes de levantar.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aduanatrack}
      POSTGRES_USER: ${POSTGRES_USER:-aduanatrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-aduanatrack}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-aduanatrack}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - cartas-poder:/data/cartas-poder
      - documentos:/data/documentos
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:8080"
    restart: unless-stopped

volumes:
  pgdata:
  cartas-poder:
  documentos:
