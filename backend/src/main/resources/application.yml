spring:
  application:
    name: aduanatrack
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aduanatrack}
    username: ${SPRING_DATASOURCE_USERNAME:aduanatrack}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    time-zone: America/Lima

server:
  port: 8080
  # IP real del cliente detrás de nginx (X-Forwarded-For) para la auditoría de accesos.
  forward-headers-strategy: native

aduanatrack:
  zona-horaria: America/Lima
  cartas-poder:
    # En Docker Compose es el volumen cartas-poder.
    directorio: ${CARTAS_PODER_DIR:/data/cartas-poder}
    # Alerta de cartas por vencer: todos los días a las 7:00 (hora de Lima).
    cron-alerta: ${CARTAS_PODER_CRON_ALERTA:0 0 7 * * *}
  documentos:
    # Documentos del despacho (HU-06): {directorio}/{despachoId}/{uuid}.pdf. En Docker Compose es el volumen documentos.
    directorio: ${DOCUMENTOS_DIR:/data/documentos}
  seguridad:
    # Secreto HS256 de al menos 32 caracteres; se inyecta desde .env (nunca en el repositorio).
    jwt-secret: ${JWT_SECRET}
    # En local se sirve por HTTP; en un entorno con HTTPS debe ser true.
    cookie-secure: ${COOKIE_SECURE:false}
