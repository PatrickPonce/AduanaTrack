# Alertas y PRs automáticos de actualización de dependencias.
# Al definir el stack, descomentar el ecosistema correspondiente.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    labels: [dependencias, seguridad]

