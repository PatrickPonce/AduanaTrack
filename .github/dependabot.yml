# Alertas y PRs automáticos de actualización de dependencias.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    labels: [dependencias, seguridad]

  - package-ecosystem: maven # backend (Spring Boot)
    directory: "/backend"
    target-branch: develop
    schedule:
      interval: weekly
    labels: [dependencias, seguridad]

  - package-ecosystem: npm # frontend (React)
    directory: "/frontend"
    target-branch: develop
    schedule:
      interval: weekly
    labels: [dependencias, seguridad]

  - package-ecosystem: docker # imágenes base de los Dockerfile
    directories: ["/backend", "/frontend"]
    target-branch: develop
    schedule:
      interval: weekly
    labels: [dependencias, seguridad]
