# Despliegue con la base de datos en Neon (sin contenedor Postgres):
#   docker compose -f docker-compose.prod.yml up --build → http://localhost
# Requiere en .env: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD y JWT_SECRET.
# La URL debe ser la conexión directa de Neon (sin -pooler) y terminar en ?sslmode=require.
# Flyway crea las tablas en Neon al arrancar el backend.
services:
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?Defina SPRING_DATASOURCE_URL en .env}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?Defina SPRING_DATASOURCE_USERNAME en .env}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Defina SPRING_DATASOURCE_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - cartas-poder:/data/cartas-poder
      - documentos:/data/documentos
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:8080"
    restart: unless-stopped

# Los PDF (cartas de poder, documentos, cargo de la DAM) siguen en archivos, no en Neon:
# el servidor donde se despliegue debe conservar estos volúmenes.
volumes:
  cartas-poder:
  documentos:
